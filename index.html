<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conical Surface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #222;
        }

        .inputContainer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        p {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
        }

        input[type="number"] {
            width: 80px;
            padding: 5px 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #007bff;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #canvas-holder {
            margin-top: 20px;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h2>Conical Surface with a Directrix Curve on a Sphere</h2>
    <div class="inputContainer">
        <p>U Min:</p>
        <input type="number" name="UMin" id="UMin" min="-360" max="0" step="5" value="-180" onchange="update()">

        <p>U Max:</p>
        <input type="number" name="UMax" id="UMax" min="0" max="360" step="5" value="180" onchange="update()">
    </div>

    <div class="inputContainer">
        <p>V Min:</p>
        <input type="number" name="VMin" id="VMin" min="-10" max="10" step="0.1" value="-2" onchange="update()">

        <p>V Max:</p>
        <input type="number" name="VMax" id="VMax" min="-10" max="10" step="0.1" value="0" onchange="update()">
    </div>

    <div class="inputContainer">
        <p>U Steps:</p>
        <input type="number" name="USteps" id="USteps" min="2" max="100" step="1" value="100" onchange="update()">

        <p>V Steps:</p>
        <input type="number" name="VSteps" id="VSteps" min="2" max="100" step="1" value="100" onchange="update()">
    </div>

    <div class="inputContainer">
        <p>A:</p>
        <input type="number" name="A" id="A" min="0" max="20" step="0.1" value="2">

        <p>P:</p>
        <input type="number" name="P" id="P" min="0" max="20" step="0.1" value="1">
    </div>

    <div id="canvas-holder">
        <canvas id="webglcanvas" width="700" height="700"></canvas>
    </div>

    <script defer type="module" src="./main.mjs"></script>
    <script src="./shader.gpu"></script>
    <script src="./Utils/m4.js"></script>
</body>

</html>
